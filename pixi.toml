[workspace]
name = "proxsuite"
version = "0.7.2"
description = "The Advanced Proximal Optimization Toolbox"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
ccache = ">=4.9.1"
cmake = ">=3.22"
cxx-compiler = ">=1.7.0"
ninja = ">=1.11"
eigen = ">=3.4.0,<4"
simde = ">=0.8.2,<0.9"
catch2 = ">=3.8.0,<4"       # Only for test
cereal = ">=1.3.2,<2"       # only for test
python = ">=3.8, <3.13"     # Only for python bindings
python_abi = ">=3.8, <3.13"
nanobind = ">=2.9.2,<3"     # Only for python bindings
libmatio = ">=1.5.28,<2"    # Only for maros meszaros tests
doxygen = ">=1.13.2,<2"     # Only for doc
graphviz = ">=13.1.2,<14"   # Only for doc
pytest = ">=8.4.2,<9"
numpy = ">=1.24.0,<2"
pre-commit = ">=4.3.0,<5"
scipy = ">=1.16.3,<2"

[tasks.configure]
cmd = [
  "cmake",
  # "--debug-find",
  "-S",
  ".",
  "-B",
  "build/Release",
  "-G",
  "Ninja",
  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
  "--profiling-output=cmake-profiling.json",
  "--profiling-format=google-trace",
  "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
  "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
  "-DBUILD_WITH_VECTORIZATION_SUPPORT=ON",
  "-DBUILD_WITH_SERIALIZATION=ON",
  "-DBUILD_MAROS_MESZAROS_TESTS=OFF",
  "-DENABLE_WARNINGS=OFF",
  "-DENABLE_WARNINGS_AS_ERRORS=OFF",
  "-DBUILD_TESTS=ON",
  "-DBUILD_DOCUMENTATION=ON",
  "-DBUILD_EXAMPLES=ON",
  "-DBUILD_BENCHMARK=ON",
  "-DBUILD_PYTHON_INTERFACE=ON",
  "-DGENERATE_PYTHON_STUBS=ON",
  "-DBUILD_WITH_OPENMP_SUPPORT=ON",
  "-DBUILD_BINDINGS_WITH_AVX2_SUPPORT=ON",
  "-DBUILD_BINDINGS_WITH_AVX512_SUPPORT=ON",
]

[tasks.reconfigure]
depends-on = ["clear", "configure"]

[tasks.build]
depends-on = ["configure"]
cmd = ["cmake", "--build", "build/Release"]

[tasks.test]
depends-on = ["build"]
cmd = ["ctest", "--test-dir", "build/Release", "--output-on-failure"]

[tasks.test-import-python]
depends-on = ["install"]
cmd = [
  "python",
  "-c",
  "import proxsuite; print(proxsuite.helpers.printVersion())",
]

[tasks.install]
depends-on = ["build"]
cmd = ["cmake", "--install", "build/Release"]


[tasks._test-packaging-configure]
depends-on = ["install"]
cmd = [
  "cmake",
  "-G", "Ninja",
  "-S", "test/packaging/cmake",
  "-B", "build/Release/test-packaging",
  "-DCMAKE_VERBOSE_MAKEFILE=1",
]

[tasks.test-packaging]
depends-on = ["_test-packaging-configure"]
cmd = ["cmake", "--build", "build/Release/test-packaging"]

[tasks.doc]
depends-on = ["configure"]
cmd = ["cmake", "--build", "build/Release", "--target", "doc"]

[tasks.clear]
cmd = ["cmake", "-E", "remove_directory", "build/Release"]

[tasks.clean]
depends-on = ["configure"]
cmd = ["cmake", "--build", "build/Release", "--target", "clean"]

[tasks.lint]
cmd = ["pre-commit", "run", "--all"]
